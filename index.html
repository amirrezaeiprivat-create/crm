<!DOCTYPE html>
<html lang="sv" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundregister CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-200">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-brand-500 text-white rounded-xl shadow-md shadow-brand-500/20">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Kundregister CRM</h1>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Personlig CRM & Kontakthantering</p>
                </div>
            </div>

            <div class="flex items-center gap-2 self-end sm:self-auto">
                <button id="darkModeToggle" class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-700/60 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition" title="Växla mörkt/ljust läge">
                    <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                </button>
                <button id="openSettingsBtn" class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-700/60 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition" title="Inställningar">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
                <button id="openAddModalBtn" class="bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center gap-2 text-sm shadow-sm shadow-brand-500/20">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Ny kund</span>
                </button>
            </div>
        </header>

        <!-- Statistikkort (Dashboard) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Totalt kunder</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-900 dark:text-white mt-1">0</p>
                </div>
                <div class="p-2.5 bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-400 rounded-xl">
                    <i data-lucide="users" class="w-5 h-5"></i>
                </div>
            </div>
            
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">Aktiva</p>
                    <p id="statActive" class="text-2xl font-bold text-slate-900 dark:text-white mt-1">0</p>
                </div>
                <div class="p-2.5 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 rounded-xl">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-amber-600 dark:text-amber-400 uppercase tracking-wider">Prospekt</p>
                    <p id="statProspect" class="text-2xl font-bold text-slate-900 dark:text-white mt-1">0</p>
                </div>
                <div class="p-2.5 bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 rounded-xl">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Inaktiva</p>
                    <p id="statInactive" class="text-2xl font-bold text-slate-900 dark:text-white mt-1">0</p>
                </div>
                <div class="p-2.5 bg-slate-100 dark:bg-slate-700/50 text-slate-400 rounded-xl">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
            </div>
        </div>

        <!-- Sök & Filtrering -->
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Sök namn, företag, e-post eller tel..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="flex bg-slate-100 dark:bg-slate-900/60 p-1 rounded-xl border border-slate-200/60 dark:border-slate-700/60 text-xs font-medium">
                    <button class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm" data-filter="Alla">Alla</button>
                    <button class="filter-btn px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900" data-filter="Aktiv">Aktiva</button>
                    <button class="filter-btn px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900" data-filter="Prospekt">Prospekt</button>
                    <button class="filter-btn px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900" data-filter="Inaktiv">Inaktiva</button>
                </div>

                <select id="sortSelect" class="bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none dark:text-white">
                    <option value="name">Sortera: Namn (A-Ö)</option>
                    <option value="newest">Sortera: Nyaste först</option>
                    <option value="company">Sortera: Företag</option>
                </select>
            </div>
        </div>

        <!-- Kundlista / Tabell -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50/80 dark:bg-slate-900/40 border-b border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-3.5 px-6">Kund / Kontakt</th>
                            <th class="py-3.5 px-6">Företag</th>
                            <th class="py-3.5 px-6">Kontaktuppgifter</th>
                            <th class="py-3.5 px-6">Status</th>
                            <th class="py-3.5 px-6">Anteckningar</th>
                            <th class="py-3.5 px-6 text-right">Åtgärder</th>
                        </tr>
                    </thead>
                    <tbody id="customerList" class="divide-y divide-slate-100 dark:divide-slate-700/60">
                        <!-- Laddas dynamiskt -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal: Lägg till / Redigera kund -->
    <div id="customerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-4">
                <h3 id="modalTitle" class="font-bold text-slate-900 dark:text-white text-lg">Lägg till ny kund</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="customerForm" class="space-y-4">
                <input type="hidden" id="custId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Namn *</label>
                    <input type="text" id="custName" required placeholder="t.ex. Anna Andersson" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Företag</label>
                    <input type="text" id="custCompany" placeholder="t.ex. Nordic Tech AB" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">E-post</label>
                        <input type="email" id="custEmail" placeholder="anna@foretag.se" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Telefon</label>
                        <input type="tel" id="custPhone" placeholder="070-123 45 67" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Status</label>
                    <select id="custStatus" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                        <option value="Aktiv">Aktiv</option>
                        <option value="Prospekt">Prospekt</option>
                        <option value="Inaktiv">Inaktiv</option>
                    </select>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-sm font-medium">Avbryt</button>
                    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-sm shadow-brand-500/20">Spara kund</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Anteckningar -->
    <div id="notesModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 id="notesModalTitle" class="font-bold text-slate-900 dark:text-white text-lg">Anteckningar</h3>
                <button id="closeNotesModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div id="notesListModal" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Anteckningar laddas här -->
            </div>

            <div class="flex gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
                <input type="text" id="modalNoteInput" placeholder="Skriv ny anteckning..." class="flex-1 px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                <button id="addModalNoteBtn" class="bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Lägg till</button>
            </div>
        </div>
    </div>

    <!-- Modal: Inställningar -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-slate-900 dark:text-white text-lg flex items-center gap-2">
                    <i data-lucide="database" class="w-5 h-5 text-brand-500"></i> Supabase-inställningar
                </h3>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">Anslutningen är automatiskt konfigurering via koden.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Supabase URL</label>
                    <input type="text" id="supabaseUrlInput" readonly class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono text-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">Supabase Anon Key</label>
                    <textarea id="supabaseKeyInput" rows="2" readonly class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono text-slate-500"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // HÅRDKODADE CREDENTIALS
        const DEFAULT_URL = 'https://mblldnfeknrrkunkbxjy.supabase.co';
        const DEFAULT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibGxkbmZla25ycmt1bmtieGp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODMzNTIsImV4cCI6MjEwMDU1OTM1Mn0.LNG5QDtywu_UQT985m5TOtP5OR_EIbg72KMSlI8xJHI';

        let supabaseClient = null;
        let customers = [];
        let notes = [];
        let currentFilter = 'Alla';
        let activeNoteCustomerId = null;

        // Mörkt läge
        if (localStorage.getItem('crm_dark_mode') === 'true') {
            document.documentElement.classList.add('dark');
        }

        document.getElementById('darkModeToggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('crm_dark_mode', isDark);
        });

        // Initiering
        try {
            supabaseClient = supabase.createClient(DEFAULT_URL, DEFAULT_KEY);
            document.getElementById('supabaseUrlInput').value = DEFAULT_URL;
            document.getElementById('supabaseKeyInput').value = DEFAULT_KEY;
            fetchFromSupabase();
        } catch (e) {
            console.error('Initieringsfel:', e);
        }

        async function fetchFromSupabase() {
            if (!supabaseClient) return;
            const { data: custData } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
            const { data: noteData } = await supabaseClient.from('notes').select('*').order('created_at', { ascending: true });

            if (custData) customers = custData;
            if (noteData) notes = noteData;

            updateStats();
            renderCustomers();
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = customers.length;
            document.getElementById('statActive').textContent = customers.filter(c => c.status === 'Aktiv').length;
            document.getElementById('statProspect').textContent = customers.filter(c => c.status === 'Prospekt').length;
            document.getElementById('statInactive').textContent = customers.filter(c => c.status === 'Inaktiv').length;
        }

        function renderCustomers() {
            const list = document.getElementById('customerList');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            list.innerHTML = '';

            let filtered = customers.filter(c => {
                const matchFilter = currentFilter === 'Alla' || c.status === currentFilter;
                const matchSearch = c.name.toLowerCase().includes(searchText) ||
                                    (c.company && c.company.toLowerCase().includes(searchText)) ||
                                    (c.email && c.email.toLowerCase().includes(searchText));
                return matchFilter && matchSearch;
            });

            // Sortering
            filtered.sort((a, b) => {
                if (sortBy === 'name') return a.name.localeCompare(b.name);
                if (sortBy === 'company') return (a.company || '').localeCompare(b.company || '');
                if (sortBy === 'newest') return new Date(b.created_at) - new Date(a.created_at);
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-12 text-center text-slate-400">
                            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                            <p class="text-sm">Inga kunder hittades.</p>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
                return;
            }

            filtered.forEach(c => {
                const customerNotes = notes.filter(n => n.customer_id === c.id);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition border-b border-slate-100 dark:border-slate-700/60";

                tr.innerHTML = `
                    <td class="py-4 px-6">
                        <div class="font-semibold text-slate-900 dark:text-white">${escapeHtml(c.name)}</div>
                        <div class="text-xs text-slate-400">Tillagd ${new Date(c.created_at || Date.now()).toLocaleDateString('sv-SE')}</div>
                    </td>
                    <td class="py-4 px-6 font-medium text-slate-600 dark:text-slate-300">
                        ${c.company ? escapeHtml(c.company) : '-'}
                    </td>
                    <td class="py-4 px-6 text-xs text-slate-500 dark:text-slate-400 space-y-1">
                        ${c.email ? `<div class="flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5"></i> ${escapeHtml(c.email)}</div>` : ''}
                        ${c.phone ? `<div class="flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5"></i> ${escapeHtml(c.phone)}</div>` : ''}
                    </td>
                    <td class="py-4 px-6">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full inline-flex items-center gap-1.5 ${getStatusBadge(c.status)}">
                            ${c.status || 'Aktiv'}
                        </span>
                    </td>
                    <td class="py-4 px-6">
                        <button onclick="openNotesModal('${c.id}')" class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 bg-slate-100 dark:bg-slate-700/60 px-2.5 py-1.5 rounded-lg transition">
                            <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                            <span>${customerNotes.length}</span>
                        </button>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="editCustomer('${c.id}')" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg transition" title="Redigera">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteCustomer('${c.id}')" class="p-1.5 hover:bg-red-50 dark:hover:bg-red-950/40 text-slate-400 hover:text-red-600 rounded-lg transition" title="Ta bort">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                `;
                list.appendChild(tr);
            });

            lucide.createIcons();
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'Aktiv': return 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800';
                case 'Prospekt': return 'bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-800';
                case 'Inaktiv': return 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600';
                default: return 'bg-slate-100 dark:bg-slate-700 text-slate-600';
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Filterknappar
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.className = "filter-btn px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900";
                });
                e.target.className = "filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm font-semibold";
                currentFilter = e.target.getAttribute('data-filter');
                renderCustomers();
            });
        });

        document.getElementById('searchInput').addEventListener('input', renderCustomers);
        document.getElementById('sortSelect').addEventListener('change', renderCustomers);

        // Modaler
        const custModal = document.getElementById('customerModal');
        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            document.getElementById('customerForm').reset();
            document.getElementById('custId').value = '';
            document.getElementById('modalTitle').textContent = 'Lägg till ny kund';
            custModal.classList.remove('hidden');
        });
        document.getElementById('closeModalBtn').addEventListener('click', () => custModal.classList.add('hidden'));
        document.getElementById('cancelModalBtn').addEventListener('click', () => custModal.classList.add('hidden'));

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('custId').value;
            const custData = {
                name: document.getElementById('custName').value,
                company: document.getElementById('custCompany').value,
                email: document.getElementById('custEmail').value,
                phone: document.getElementById('custPhone').value,
                status: document.getElementById('custStatus').value,
            };

            if (id) {
                await supabaseClient.from('customers').update(custData).eq('id', id);
            } else {
                custData.id = crypto.randomUUID();
                custData.created_at = new Date().toISOString();
                await supabaseClient.from('customers').insert([custData]);
            }

            custModal.classList.add('hidden');
            fetchFromSupabase();
        });

        function editCustomer(id) {
            const c = customers.find(x => x.id === id);
            if (!c) return;
            document.getElementById('custId').value = c.id;
            document.getElementById('custName').value = c.name || '';
            document.getElementById('custCompany').value = c.company || '';
            document.getElementById('custEmail').value = c.email || '';
            document.getElementById('custPhone').value = c.phone || '';
            document.getElementById('custStatus').value = c.status || 'Aktiv';
            document.getElementById('modalTitle').textContent = 'Redigera kund';
            custModal.classList.remove('hidden');
        }

        async function deleteCustomer(id) {
            if (!confirm('Vill du verkligen radera denna kund?')) return;
            await supabaseClient.from('customers').delete().eq('id', id);
            fetchFromSupabase();
        }

        // Anteckningar modal
        const notesModal = document.getElementById('notesModal');
        function openNotesModal(customerId) {
            activeNoteCustomerId = customerId;
            const c = customers.find(x => x.id === customerId);
            document.getElementById('notesModalTitle').textContent = `Anteckningar: ${c ? c.name : ''}`;
            renderModalNotes();
            notesModal.classList.remove('hidden');
        }
        document.getElementById('closeNotesModalBtn').addEventListener('click', () => notesModal.classList.add('hidden'));

        function renderModalNotes() {
            const list = document.getElementById('notesListModal');
            const custNotes = notes.filter(n => n.customer_id === activeNoteCustomerId);
            list.innerHTML = '';

            if (custNotes.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 py-4 text-center">Inga anteckningar än.</p>`;
                return;
            }

            custNotes.forEach(n => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl text-xs text-slate-700 dark:text-slate-300 flex justify-between items-start gap-2 border border-slate-100 dark:border-slate-700/60";
                div.innerHTML = `
                    <span>${escapeHtml(n.content)}</span>
                    <button onclick="deleteNoteModal('${n.id}')" class="text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                `;
                list.appendChild(div);
            });
            lucide.createIcons();
        }

        document.getElementById('addModalNoteBtn').addEventListener('click', async () => {
            const input = document.getElementById('modalNoteInput');
            const content = input.value.trim();
            if (!content || !activeNoteCustomerId) return;

            await supabaseClient.from('notes').insert([{
                id: crypto.randomUUID(),
                customer_id: activeNoteCustomerId,
                content: content,
                created_at: new Date().toISOString()
            }]);

            input.value = '';
            fetchFromSupabase().then(renderModalNotes);
        });

        async function deleteNoteModal(id) {
            await supabaseClient.from('notes').delete().eq('id', id);
            fetchFromSupabase().then(renderModalNotes);
        }

        // Inställningar modal
        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('openSettingsBtn').addEventListener('click', () => settingsModal.classList.remove('hidden'));
        document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.add('hidden'));

        lucide.createIcons();
    </script>
</body>
</html>
